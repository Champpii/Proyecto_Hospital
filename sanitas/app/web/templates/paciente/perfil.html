{% extends "base/base.html" %}

{% block title %}Editar Mis Datos - Hospital Sanitas{% endblock %}

{% block content %}
<div style="max-width: 700px; margin: 0 auto;">
  <div class="card">
    <div class="card-header">
      <h2 class="card-title">Modificar Mis Datos Personales</h2>
    </div>

    <form action="/paciente/perfil" method="post">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="nombre">Nombre *</label>
          <input type="text" id="nombre" name="nombre" class="form-control" value="{{ paciente.usuario.nombre }}" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="apellido">Apellido *</label>
          <input type="text" id="apellido" name="apellido" class="form-control" value="{{ paciente.usuario.apellido }}" required>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="dpi">DPI / Documento</label>
          <input type="text" id="dpi" name="dpi" class="form-control" value="{{ paciente.dpi or '' }}">
        </div>
        <div class="form-group">
          <label class="form-label" for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" class="form-control" value="{{ paciente.telefono or '' }}">
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="fecha_nacimiento">Fecha de Nacimiento</label>
          <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" class="form-control" value="{{ paciente.fecha_nacimiento or '' }}">
        </div>
        <div class="form-group">
          <label class="form-label" for="tipo_sangre">Tipo de Sangre</label>
          <select id="tipo_sangre" name="tipo_sangre" class="form-control">
            <option value="">Seleccione...</option>
            {% for ts in ['O+', 'O-', 'A+', 'A-', 'B+', 'B-', 'AB+', 'AB-'] %}
              <option value="{{ ts }}" {% if paciente.tipo_sangre == ts %}selected{% endif %}>{{ ts }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div style="display: flex; gap: 1rem; margin-top: 1rem;">
        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        <a href="/paciente/dashboard" class="btn btn-secondary">Volver al Historial</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
