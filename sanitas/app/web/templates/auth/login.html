{% extends "base/base.html" %}

{% block title %}Iniciar Sesión - Hospital Sanitas{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h2 class="auth-title">Hospital Sanitas</h2>
    <p class="auth-subtitle">Ingresa a tu cuenta para continuar</p>

    <form action="/auth/web/login" method="post">
      <div class="form-group">
        <label class="form-label" for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" class="form-control" placeholder="tu.correo@ejemplo.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">Ingresar</button>
    </form>

    <div class="auth-footer">
      ¿Eres paciente y aún no tienes cuenta?
      <a href="/registro">Regístrate aquí</a>
    </div>
  </div>
</div>
{% endblock %}
