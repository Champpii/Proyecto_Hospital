{% extends "base/base.html" %}

{% block title %}Auto-Registro de Paciente - Hospital Sanitas{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card" style="max-width: 580px;">
    <h2 class="auth-title">Auto-Registro de Paciente</h2>
    <p class="auth-subtitle">Crea tu cuenta para acceder a tu historial médico</p>

    <form action="/auth/web/registro" method="post">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="nombre">Nombre *</label>
          <input type="text" id="nombre" name="nombre" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="apellido">Apellido *</label>
          <input type="text" id="apellido" name="apellido" class="form-control" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="correo">Correo electrónico *</label>
        <input type="email" id="correo" name="correo" class="form-control" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña (mínimo 6 caracteres) *</label>
        <input type="password" id="password" name="password" minlength="6" class="form-control" required>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="fecha_nacimiento">Fecha de Nacimiento</label>
          <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label" for="dpi">DPI / Documento</label>
          <input type="text" id="dpi" name="dpi" class="form-control">
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label" for="tipo_sangre">Tipo de Sangre</label>
          <select id="tipo_sangre" name="tipo_sangre" class="form-control">
            <option value="">Seleccione...</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Completar Registro</button>
    </form>

    <div class="auth-footer">
      ¿Ya tienes una cuenta? <a href="/login">Inicia sesión</a>
    </div>
  </div>
</div>
{% endblock %}
