<div class="card" style="margin-top: 1rem;">
  <div class="card-header">
    <h3 class="card-title">Subir Examen o Imagen Médica</h3>
  </div>
  <form action="/medico/pacientes/{{ paciente.id }}/archivos" method="post" enctype="multipart/form-data">
    <div class="form-group">
      <label class="form-label" for="archivo">Archivo (PDF, PNG o JPG - Máx 5 MB) *</label>
      <input type="file" name="archivo" id="archivo" class="form-control" accept=".pdf,.png,.jpg,.jpeg" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="descripcion_archivo">Descripción del examen o estudio</label>
      <input type="text" name="descripcion" id="descripcion_archivo" class="form-control" placeholder="Ej. Hemograma completo, Radiografía de tórax...">
    </div>

    <button type="submit" class="btn btn-primary">Subir Adjunto</button>
  </form>
</div>
